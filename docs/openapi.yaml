openapi: 3.1.0
info:
  title: SecureCare API
  version: 1.0.0
  description: Hospital management REST API. All endpoints except health and login require a Bearer JWT.
servers:
  - url: http://localhost:8080/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        path: {type: string}
    UserDto:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [ADMIN, DOCTOR, NURSE, RECEPTIONIST, PATIENT]}
        email: {type: string, format: email}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time, nullable: true}
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses: {'200': {description: Service health}}
  /auth/login:
    post:
      security: []
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses: {'200': {description: Authenticated}, '401': {description: Invalid credentials}, '429': {description: Rate limited}}
  /dashboard:
    get:
      summary: Dashboard counts and recent activity
      responses: {'200': {description: Dashboard summary}}
  /{resource}:
    parameters:
      - in: path
        name: resource
        required: true
        schema: {type: string, enum: [patients, doctors, appointments, prescriptions, medical-records, wards, admissions, billing]}
    get:
      summary: List records
      responses: {'200': {description: Records}}
    post:
      summary: Create record
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses: {'200': {description: Created record}, '400': {description: Validation error}}
  /{resource}/{id}:
    parameters:
      - in: path
        name: resource
        required: true
        schema: {type: string}
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: Get record
      responses: {'200': {description: Record}}
    put:
      summary: Update record
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses: {'200': {description: Updated record}}
    delete:
      summary: Delete record
      responses: {'200': {description: Deleted}}
  /audit-logs:
    get:
      summary: List audit events (ADMIN only)
      responses: {'200': {description: Audit events}}
  /users:
    get:
      summary: List users (ADMIN only)
      responses: {'200': {description: User list}}
    post:
      summary: Create user (ADMIN only)
      responses: {'200': {description: User created}}

  /me:
    get:
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserDto'}
        '401': {description: Unauthenticated}
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: Get a user by ID (ADMIN only)
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserDto'}
        '404': {description: User not found}
    patch:
      summary: Partially update a user (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: {type: string, format: email}
                role: {type: string, enum: [ADMIN, DOCTOR, NURSE, RECEPTIONIST, PATIENT]}
                active: {type: boolean}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserDto'}
        '400': {description: Invalid or unsupported update fields}
        '404': {description: User not found}
    delete:
      summary: Deactivate a user (ADMIN only)
      responses:
        '204': {description: User deactivated}
        '400': {description: Cannot deactivate yourself or the last active administrator}
        '404': {description: User not found}
  /users/{id}/active:
    patch:
      summary: Activate or deactivate user (ADMIN only)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: {type: boolean}
      responses: {'200': {description: Updated user}}
  /pricing/appointment:
    post:
      summary: Calculate an appointment estimate using the pricing strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMinutes: {type: integer}
      responses: {'200': {description: Estimated amount}}
